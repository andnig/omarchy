exec-once = hypridle & mako & waybar & fcitx5
exec-once = swaybg -i ~/.config/omarchy/current/background -m fill
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-clip-persist --clipboard regular & clipse -listen
exec-once = [workspace 1 silent] kitty
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 3 silent] thunderbird
exec-once = [workspace 4 silent] nautilus
exec-once = ~/.local/share/omarchy/bin/start-webapps.sh
exec-once = [workspace 6 silent] 1password
